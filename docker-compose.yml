name: orbit

# Common environment shared by every Orbit service. Service-specific database
# URLs and build targets are set per service below.
x-orbit-env: &orbit-env
  ORBIT_KAFKA_BROKERS: redpanda:9092
  ORBIT_KAFKA_TOPIC_PREFIX: orbit
  ORBIT_ENABLE_FAULT_INJECTION: "true"
  ORBIT_LOG_FORMAT: text
  ORBIT_LOG_LEVEL: info
  ORBIT_OTLP_ENDPOINT: ${ORBIT_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-api:
    build:
      context: .
      args:
        SERVICE: order-api
    environment:
      <<: *orbit-env
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_order?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      <<: *orbit-env
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_inventory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-api:
        condition: service_started

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      <<: *orbit-env
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_payment?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-api:
        condition: service_started

  fulfillment-service:
    build:
      context: .
      args:
        SERVICE: fulfillment-service
    environment:
      <<: *orbit-env
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_fulfillment?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-api:
        condition: service_started

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      <<: *orbit-env
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_notification?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-api:
        condition: service_started

  # Operator tooling. Run with: docker compose run --rm orbitctl <args>
  orbitctl:
    build:
      context: .
      args:
        SERVICE: orbitctl
    profiles: ["tools"]
    environment:
      ORBIT_KAFKA_BROKERS: redpanda:9092
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit_order?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # One-shot seed of development inventory. Run with: docker compose run --rm seed
  seed:
    build:
      context: .
      args:
        SERVICE: orbitctl
    profiles: ["tools"]
    command:
      - seed
      - inventory
      - --database-url
      - postgres://orbit:orbit@postgres:5432/orbit_inventory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redpanda-data:
